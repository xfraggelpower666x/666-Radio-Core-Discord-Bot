services:
  - type: web
    name: 666-radiobotai-player-alert-backend
    env: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PLAYER_ALERT_TTL_SECONDS
        value: "900"
      - key: PLAYER_ALERT_MAX_HISTORY
        value: "30"
      - key: MASTER_ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MASTERING_BACKEND_TOKEN
        sync: false
      - key: SYSTEM_PW_WORKER_URL
        value: https://666-system-pw.666soundsdesign-broadcaster.com
