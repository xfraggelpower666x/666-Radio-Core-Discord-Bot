services:
  radiobotai:
    container_name: 666-radiobotai-hybrid
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HEALTH_PORT:-8080}:${HEALTH_PORT:-8080}"
    volumes:
      - ./db:/app/db
      - ./runtime:/app/runtime
      - ./music:/app/music
      - ./botconfig:/app/botconfig
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${HEALTH_PORT:-8080}/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
